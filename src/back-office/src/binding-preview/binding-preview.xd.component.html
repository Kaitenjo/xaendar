<dl class="preview">
  <div class="{ isBound(value()) ? 'preview__row preview__row--bound' : 'preview__row' }">
    <dt>value</dt>
    <dd>{ value() }</dd>
  </div>
  <div class="{ isBound(detail()) ? 'preview__row preview__row--bound' : 'preview__row' }">
    <dt>detail</dt>
    <dd>{ detail() }</dd>
  </div>
</dl>
