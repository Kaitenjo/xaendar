<div class="slots">
  <div class="slots__area">
    <span class="slots__name">header</span>
    <slot name="header">
      <span class="fallback" item>fallback</span>
    </slot>
  </div>
  <div class="slots__area">
    <span class="slots__name">default</span>
    <slot />
  </div>
  <div class="slots__area">
    <span class="slots__name">{ footerSlot() }</span>
    <slot name="{footerSlot()}" />
  </div>
</div>
<dl class="preview">
  <div class="preview__row">
    <dt>{ labels.first }</dt>
    <dd>{ describe(first()) }</dd>
  </div>
  <div class="preview__row">
    <dt>{ labels.all }</dt>
    <dd>{ describeAll(all()) }</dd>
  </div>
  <div class="preview__row">
    <dt>{ labels.header }</dt>
    <dd>{ describeAll(header()) }</dd>
  </div>
  <div class="preview__row">
    <dt>{ labels.edges }</dt>
    <dd>{ describeAll(edges()) }</dd>
  </div>
  <div class="preview__row">
    <dt>{ labels.lightDom }</dt>
    <dd>{ describeAll(lightDom()) }</dd>
  </div>
</dl>
