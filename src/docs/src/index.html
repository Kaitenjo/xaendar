<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xaendar: Web Components built declaratively, with fine-grained, compile-time reactivity." />
    <title>Xaendar — Docs</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      // Applies the theme before the first paint, to avoid a flash of the wrong one
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('xaendar-docs-theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./signals.ts"></script>
    <script type="module" src="./main.ts"></script>
  </head>
  <body></body>
</html>
