<form (submit)="add($event)">
  <input name="item" placeholder="Add an item" autocomplete="off" />
  <button>Add</button>
</form>
@if (items().length) {
  <ul>
    <!-- Items are tracked by identity: a replaced item is rendered again -->
    @for (item of items(); track item) {
      <li class="{ item.done ? 'done' : '' }">
        <label>
          <input
            type="checkbox"
            (change)="toggle(item.id)"
            @if (item.done) {
              checked
            }
          />
          { item.name }
        </label>
      </li>
    }
  </ul>
  <p>{ remaining() } of { items().length } left · <button (click)="clear()">Clear</button></p>
} @else {
  <p>The list is empty: add something!</p>
}
