<div class="stars" (mouseleave)="clearPreview()">
  @for (star of stars; track star) {
    <button
      class="{ star > shown() ? 'star' : 'star star--on' }"
      aria-label="{ star + ' stars' }"
      (click)="rate(star)"
      (mouseenter)="preview(star)"
    >★</button>
  }
</div>
<p class="label">{ label() } · { value() }/5</p>
