<div class="stars" (mouseleave)="clearPreview()">
  @for (star of stars) {
    <button class="star" [class.star--on]="{star() <= shown()}" aria-label="{`${star()} stars`}"
      (click)="rate(star())" (mouseenter)="preview(star())">
      ★
    </button>
  }
</div>
<p class="label">{ label() } · { value() }/5</p>
