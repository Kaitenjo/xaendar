@import { ButtonComponent } from '../../../shared/button/button.xd.component.ts'

<ex-button (click)="inspect()">Inspect this component</ex-button>
@if (facts().length) {
  <table>
    <tbody>
      @for (fact of facts(); track fact().id) {
        <tr>
          <td>
            <code>{ fact().expression }</code>
          </td>
          <td>{ fact().result }</td>
        </tr>
      }
    </tbody>
  </table>
}
