@import { CardComponent } from './card.xd.component.ts'

<label><input type="checkbox" checked (change)="toggleFooter()" /> Footer on the first card</label>
<div class="cards">
  <ex-card>
    <strong slot="header">Signals</strong>
    <p>Values that notify their readers when they change.</p>
    @if (withFooter()) {
      <button slot="footer" (click)="like()">Like: { likes() }</button>
    }
  </ex-card>
  <ex-card>
    <p>A card with a body only: the header shows its fallback.</p>
  </ex-card>
</div>
