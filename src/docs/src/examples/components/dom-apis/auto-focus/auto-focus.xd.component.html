@import { ButtonComponent } from '../../../shared/button/button.xd.component.ts'

@if (editing()) {
  <input type="text" value="{heading()}" aria-label="Title" (keydown.enter)="onKeydownEnter($event)" (keydown.escape)="onKeydownEscape()" />
  <span class="hint">Enter to save, Escape to cancel</span>
} @else {
  <strong>{ heading() }</strong>
  <ex-button (click)="edit()">Edit</ex-button>
}
