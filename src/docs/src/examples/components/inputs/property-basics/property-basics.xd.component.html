@import { ProgressMeterComponent } from './progress-meter.xd.component.ts'
@import { ButtonComponent } from '../../../shared/button/button.xd.component.ts'

<div class="controls">
  <ex-button (click)="step(-1)">−1</ex-button>
  <ex-button (click)="step(1)">+1</ex-button>
  <label>
    <input type="checkbox" checked (change)="toggleValue()" />
    show-value
  </label>
</div>
<p class="caption">value, max and show-value bound</p>
<ex-progress-meter value="{ done() }" max="{ total() }" show-value="{ showValue() }" />
<p class="caption">Only value bound: max is 100, show-value is true</p>
<ex-progress-meter value="{ done() }" />
