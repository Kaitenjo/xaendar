@import { GreetingCardComponent } from './greeting-card.xd.component.ts'

<div class="controls">
  <button (click)="toggle()">
    @if (mounted()) {
      Remove the card
    } @else {
      Add the card
    }
  </button>
  <button (click)="rename()">Rename</button>
  <button (click)="clear()">Clear the log</button>
</div>
@if (mounted()) {
  <ex-greeting-card name="{ name() }" />
}
<ol>
  @for (line of log(); track line.id) {
    <li>{ line.text }</li>
  }
</ol>
