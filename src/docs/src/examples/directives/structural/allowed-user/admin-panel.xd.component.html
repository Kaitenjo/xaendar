@import { AllowedUserDirective } from './allowed-user.directive.ts'

<div class="controls">
  <button (click)="login('admin')">Admin</button>
  <button (click)="login('guest')">Guest</button>
  <button (click)="race()">Guest, then admin after 300ms</button>
  <span>User: { user() }</span>
</div>
<p class="panel" *exAllowedUser(user="{ user() }")>🔑 Admin panel</p>
<ol class="log">
  @for (line of checks(); track line.id) {
    <li>{ line.text }</li>
  }
</ol>
