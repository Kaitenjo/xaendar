@import { IsEvenDirective } from './is-even.directive.ts'
@import { PositiveDirective } from './positive.directive.ts'
@import { ButtonComponent } from '../../../shared/button/button.xd.component.ts'

<div class="controls">
  <ex-button (click)="change(-1)">−1</ex-button>
  <ex-button (click)="change(1)">+1</ex-button>
  <ex-button (click)="change(2)">+2</ex-button>
  <strong>value = { value() }</strong>
</div>
<p *exIsEven(value="{ value() }") class="even">
  Even.
  <input type="text" placeholder="Type, then press +2" />
</p>
<p *exIsEven(value="{ value() }") *exPositive(value="{ value() }") class="both">Even and positive.</p>
