@import { TintDirective } from './tint.directive.ts'
@import { VisibleWhenDirective } from './visible-when.directive.ts'

<div class="controls">
  <select (change)="pick($event)">
    <option value="#fde68a">Yellow</option>
    <option value="#bbf7d0">Green</option>
    <option value="#bfdbfe">Blue</option>
  </select>
  <button (click)="toggle()">{ shown() ? 'Hide' : 'Show' } the second paragraph</button>
</div>
<p @@exTint(color="{ color() }")>A custom directive paints this paragraph.</p>
<p *exVisibleWhen(condition="{ shown() }")>A structural directive decides whether this paragraph exists.</p>
