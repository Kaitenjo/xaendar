@import { InspectDirective } from './inspect.directive.ts'
@import { ButtonComponent } from '../../../shared/button/button.xd.component.ts'

<ex-button (click)="rename()">Change the label</ex-button>
<ul @@exInspect(label="{label()}" (report)="log($event)") id="fruits">
  <li>Apple</li>
  <li>Pear</li>
  <li>Plum</li>
</ul>
<ol class="log">
  @for (line of lines(); track line().id) {
    <li>{ line().text }</li>
  }
</ol>
