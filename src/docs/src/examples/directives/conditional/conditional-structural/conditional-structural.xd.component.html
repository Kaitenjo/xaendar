@import { IsEvenDirective } from '../../structural/parity/is-even.directive.ts'
@import { PositiveDirective } from '../../structural/parity/positive.directive.ts'

<div class="controls">
  <button (click)="change(-1)">−1</button>
  <button (click)="change(1)">+1</button>
  <label>
    <input type="checkbox" (change)="toggle()" />
    Only positive
  </label>
  <strong>value = { value() }</strong>
</div>
<p
  @if (onlyPositive()) {
    *exPositive(value="{ value() }")
  }
  *exIsEven(value="{ value() }")
>
  { value() } passes.
</p>
