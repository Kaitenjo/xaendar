<div class="card">
  <p>
    Hello,
    <strong>{ name() }</strong>!
  </p>
  <p>
    You clicked
    <strong>{ count() }</strong>
    times.
  </p>
  <p class="{ count() % 2 === 0 ? 'even' : 'odd' }">This line is styled by the parity of the count.</p>
  <p>This paragraph is static: it is never touched again.</p>
</div>
<div class="controls">
  <button (click)="increment()">Increment</button>
  <button (click)="rename()">Change name</button>
</div>
<p class="title">DOM mutations, most recent first:</p>
<ol class="log">
  @for (mutation of mutations(); track mutation.id) {
    <li>{ mutation.text }</li>
  }
</ol>
