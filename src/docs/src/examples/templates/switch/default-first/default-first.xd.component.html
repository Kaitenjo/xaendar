<button (click)="toggle()">size: { size() }</button>
<div class="columns">
  <section>
    <h5>{'@default'} last</h5>
    @switch (size()) {
      @case ('small') {
        <p>S</p>
      }
      @default {
        <p>another size</p>
      }
    }
  </section>
  <section>
    <h5>{'@default'} first</h5>
    @switch (size()) {
      @default {
        <p>another size</p>
      }
      @case ('small') {
        <p>S</p>
      }
    }
  </section>
</div>
