<label>
  <input type="checkbox" (change)="toggle()" />
  locked: { locked() }
</label>
<p>
  <button disabled="{locked()}" aria-pressed="{locked()}">disabled="{ '{ locked() }' }" aria-pressed="{ '{ locked() }' }"</button>
</p>
<p>
  <button
    @if (locked()) {
      disabled
    }
  >
    { '@if (locked()) { disabled }' }
  </button>
</p>
