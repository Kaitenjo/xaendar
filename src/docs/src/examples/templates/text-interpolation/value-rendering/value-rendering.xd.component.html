<div class="table-wrap">
  <table>
    <tbody>
      <tr>
        <td>null</td>
        <td>[{ nothing }]</td>
      </tr>
      <tr>
        <td>undefined</td>
        <td>[{ missing }]</td>
      </tr>
      <tr>
        <td>false</td>
        <td>[{ no }]</td>
      </tr>
      <tr>
        <td>0</td>
        <td>[{ zero }]</td>
      </tr>
      <tr>
        <td>an array</td>
        <td>[{ list }]</td>
      </tr>
      <tr>
        <td>an object</td>
        <td>[{ point }]</td>
      </tr>
      <tr>
        <td>an object, as JSON</td>
        <td>[{ JSON.stringify(point) }]</td>
      </tr>
      <tr>
        <td>count()</td>
        <td>[{ count() }]</td>
      </tr>
      <tr>
        <td>count, without the call</td>
        <td>
          <pre>{ count }</pre>
        </td>
      </tr>
    </tbody>
  </table>
</div>
