@import { ButtonComponent } from '../../shared/button/button.xd.component.ts'
@import { SubmitDirective } from '../../shared/submit/submit.directive.ts'

<h3>My todos</h3>
<form (submit)="add($event)">
  <input name="title" placeholder="What needs to be done?" autocomplete="off" />
  <ex-button @@exSubmit variant="primary">Add</ex-button>
</form>
<ul>
  @for (todo of todos(); track todo().id) {
    <li>{ todo().title }</li>
  }
</ul>
<p>{ todos().length } todos</p>
