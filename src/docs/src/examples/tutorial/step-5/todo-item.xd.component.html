<!-- todo() is still undefined during the first render: the parent binds it right after. Hence ?. -->
<label class="{ todo()?.done ? 'done' : '' }">
  <input
    @if (todo()?.done) {
      checked
    }
    type="checkbox"
    (change)="toggle()"
  />
  { todo()?.title }
</label>
<button (click)="delete()">✕</button>
