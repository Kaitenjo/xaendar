<form (submit)="add($event)">
  <input name="name" placeholder="New item" autocomplete="off" />
  <button type="submit">Add</button>
  <button type="button" (click)="insertRandom()">Insert at random</button>
</form>
<div class="tools">
  <input type="search" placeholder="Filter" (input)="setFilter($event)" />
  <label>
    <input type="checkbox" (change)="toggleSort()" />
    Sort by name
  </label>
</div>
@if (visible().length > 0) {
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Item</th>
          <th>Quantity</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of visible(); track item.id) {
          <tr>
            <td>{ item.id }</td>
            <td>{ item.name }</td>
            <td class="quantity">
              <button (click)="changeQuantity(item, -1)">−</button>
              <span>{ item.quantity() }</span>
              <button (click)="changeQuantity(item, 1)">+</button>
            </td>
            <td>
              <button class="remove" (click)="removeItem(item)">Remove</button>
            </td>
          </tr>
        }
      </tbody>
      <tfoot>
        <tr>
          <td></td>
          <td>Total</td>
          <td class="quantity">
            <span>{ total() }</span>
          </td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
} @else {
  <p class="empty">No items match.</p>
}
