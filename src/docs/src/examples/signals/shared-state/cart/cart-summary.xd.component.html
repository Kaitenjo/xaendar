@import { ButtonComponent } from '../../../shared/button/button.xd.component.ts'

<h4>Cart</h4>
@if (lines().length) {
  <ul>
    @for (line of lines(); track line()) {
      <li>{ line().quantity } × { line().product }</li>
    }
  </ul>
  <ex-button (click)="clear()">Empty the cart</ex-button>
} @else {
  <p>The cart is empty.</p>
}
