<button (click)="raise()">Raise the level</button>
<dl>
  <dt>shared = level</dt>
  <dd>
    <progress max="10" value="{ shared() }" />
    text: { shared() }
  </dd>
  <dt>fromHelper = readLevel()</dt>
  <dd>
    <progress max="10" value="{ fromHelper() }" />
    text: { fromHelper() }
  </dd>
  <dt>{ 'wrapped = computed(() => readLevel()())' }</dt>
  <dd>
    <progress max="10" value="{ wrapped() }" />
    text: { wrapped() }
  </dd>
</dl>
