<div class="controls">
  <button (click)="changeFirst()">first++</button>
  <button (click)="changeThreeTimes()">first++, second++, first++</button>
  <button (click)="changeAndRevert()">first++, first--</button>
</div>
<ol reversed>
  @for (run of runs(); track run.id) {
    <li>Run { run.id }: { run.text }</li>
  }
</ol>
