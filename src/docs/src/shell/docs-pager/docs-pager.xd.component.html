@if (previous() || next()) {
  <nav class="pager">
    @if (previous()) {
      <a class="card card--previous" href="{`#/${currentLang()}/${previous()?.path}`}">
        <span class="card__label">← { translations().pager.previous }</span>
        <span class="card__title">{ titleOf(previous()) }</span>
      </a>
    } @else {
      <span />
    }
    @if (next()) {
      <a class="card card--next" href="{`#/${currentLang()}/${next()?.path}`}">
        <span class="card__label">{ translations().pager.next } →</span>
        <span class="card__title">{ titleOf(next()) }</span>
      </a>
    }
  </nav>
}
