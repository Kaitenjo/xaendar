@import { DocsSearchComponent } from '../docs-search/docs-search.xd.component.ts'

<header class="bar">
  <button class="icon menu" type="button" aria-label="{ t().topbar.menu }" (click)="toggleMenu()">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <a class="brand" href="{ home() }" aria-label="{ t().brand.home }">
    <img class="logo" src="/logo.svg" alt="" width="30" height="30" />
    <span class="name">Xaendar</span>
    <span class="tagline">{ t().brand.tagline }</span>
  </a>
  <docs-search class="search" />
  <div class="actions">
    <div class="langs" role="group" aria-label="{ t().topbar.language }">
      @for (code of langs; track code) {
        <button class="{ code === lang() ? 'lang lang--active' : 'lang' }" type="button" (click)="switchTo(code)">{ code.toUpperCase() }</button>
      }
    </div>
    <button class="icon" type="button" aria-label="{ t().topbar.theme }" (click)="toggleTheme()">
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        </svg>
      }
    </button>
  </div>
</header>
