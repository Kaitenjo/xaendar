<!-- A custom directive applied while a condition holds -->
<p
  @if (highlighted()) {
    @@exTint(color="#fde68a")
  }
>
  …
</p>

<!-- Its inputs can be conditional too: the instance stays, only the binding changes -->
<p
  @@exTint(
    @if (warm()) {
      color="#fecaca"
    } @else {
      color="#bfdbfe"
    }
  )
>
  …
</p>

<!-- A structural directive applied by a condition, next to an unconditional one -->
<p
  @if (onlyPositive()) {
    *exPositive(value="{ value() }")
  }
  *exIsEven(value="{ value() }")
>
  …
</p>
