<template card(title: string, item: Item)>       <!-- declares the template: its name, then its typed parameters -->
  <h3>{ title() }</h3>                            <!-- a parameter is a signal -->
  <p>{ item().description }</p>
</template>

@render card('First', items()[0])                 <!-- renders an instance here -->
@render card('Second', items()[1])                <!-- and another one here -->

<template divider() />                           <!-- the parentheses are written without parameters too -->
