<p>{ quantity() }</p>                     <!-- a signal: always call it -->
<p>{ total() }</p>                        <!-- a computed signal -->
<p>{ formattedTotal() }</p>               <!-- a method: reactive too, in text -->
<p>{ quantity() > 1 ? 'pieces' : 'piece' }</p>
<p>{`${quantity()} pieces`}</p>           <!-- a template literal -->
<p>{`${first()} ${last()}`}</p>           <!-- one expression keeps the space -->
