@if (isAdmin()) {
  <p>Admin</p>
} @else {
  @if (isEditor()) {   <!-- ✗ an @if/@else directly inside an @else -->
    <p>Editor</p>
  } @else {
    <p>Neither</p>
  }
}
<!-- At run time the wrong branch is rendered, and: RangeError: Maximum call stack size exceeded -->

<!-- ✓ chain the conditions with @else if, or wrap the inner @if in an element -->
@if (isAdmin()) {
  <p>Admin</p>
} @else if (isEditor()) {
  <p>Editor</p>
} @else {
  <p>Neither</p>
}
