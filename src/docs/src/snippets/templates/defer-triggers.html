<!-- No triggers: when the browser has nothing else to do, as with idle -->
@defer {
  <app-recommendations />
}

<!-- load: as soon as the page is rendered, without blocking it -->
@defer (load) {
  <app-chat-widget />
}

<!-- idle: when the browser has nothing else to do, at the latest after the time given, if any -->
@defer (idle(2s)) {
  <app-recommendations />
}

<!-- timer: once the time has passed, in ms or s -->
@defer (timer(500ms)) {
  <app-newsletter />
}

<!-- visible: when the @placeholder enters the viewport -->
@defer (visible) {
  <app-map />
} @placeholder {
  <div class="map-frame" />
}

<!-- interaction: at the first click, key or focus on the @placeholder -->
@defer (interaction) {
  <app-editor />
} @placeholder {
  <button>Edit</button>
}

<!-- hover: when the pointer moves over the @placeholder, or the focus enters it -->
@defer (hover) {
  <app-preview />
} @placeholder {
  <a href="/report">Report</a>
}

<!-- when: once the expression is truthy -->
@defer (when settingsOpen()) {
  <app-settings />
}

<!-- Several triggers: the first one firing renders the content -->
@defer (visible, when settingsOpen()) {
  <app-settings />
} @placeholder {
  <div class="settings-frame" />
}
