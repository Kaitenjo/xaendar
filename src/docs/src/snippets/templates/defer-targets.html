<!-- The button outside of the block loads the editor at the first click on it -->
<button #edit>Edit</button>
@defer (interaction(edit)) {
  <app-editor />
}

<!-- The chart loads 300px before its frame enters the viewport -->
@defer (visible(frame, { rootMargin: '300px' })) {
  <app-chart />
}
<div #frame class="chart-frame" />

<!-- The options alone watch the elements of the @placeholder -->
@defer (visible({ threshold: 0.5 })) {
  <app-map />
} @placeholder {
  <div class="map-frame" />
}
