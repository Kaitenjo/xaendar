<!-- Inside a tag, @if and @switch choose which attributes, listeners and directives the element has -->
<button
  @if (locked()) {
    disabled
    title="This task is locked"
  } @else {
    title="Click to edit"
  }
  @switch (priority()) {
    @case ('urgent') {
      data-priority="urgent"
    }
  }
  class="task"
  @if (editable()) {
    (click)="edit()"
  }
>
  Write the release notes
</button>
