@import { LabEvChild } from './ev-child.xd.component.ts'
<div class="wrap">
  <lab-ev-child (valueChange)="onValue($event)" (ping)="onPing()" (payload)="onPayload($event)" />
</div>
<ul>
  @for (item of items(); track item) {
    <li class="{ active() === item ? 'active' : '' }">{ item }</li>
  }
</ul>
<p class="styled" style="{ styleObj() }">styled</p>
<button id="add" (click)="add()">add</button>
<button id="activate" (click)="activate()">activate</button>
<button id="late" (click)="makeLate()">late</button>
<button id="readlate" (click)="readLate()">readlate</button>
