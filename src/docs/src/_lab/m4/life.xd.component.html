@import { LabLifeChild } from './life-child.xd.component.ts'
<div id="a">
  <lab-life-child id="c1" name="{ who() }" count="{ n() }" label-text="hello" size="{ 21 }" tags="{ tagsA() }" />
</div>
<div id="b"></div>
<lab-life-child id="c2" name="x"
  @if (bound()) {
    count="{ n() }"
  }
/>
@if (show()) {
  <lab-life-child id="c3" name="{ who() }" count="{ n() }" />
}
<button id="inc" (click)="inc()">inc</button>
<button id="rename" (click)="rename()">rename</button>
<button id="bound" (click)="toggleBound()">bound</button>
<button id="same" (click)="sameTags()">same</button>
<button id="other" (click)="otherTags()">other</button>
<button id="show" (click)="toggleShow()">show</button>
<button id="move" (click)="move()">move</button>
<button id="attr" (click)="setAttr()">attr</button>
