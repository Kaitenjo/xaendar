# Checks every push to main and every pull request: lint, type-checks, tests with the coverage enforced at 100%,
# the specs of the documentation site, then the builds of the packages and of the site, whose output is discarded with
# the runner. The release workflow runs the same checks again before publishing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/docs/package-lock.json

      # The engines of package.json ask for npm 12
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix src/docs

      - name: Lint
        run: npm run lint

      - name: Type-check the specs
        run: npm run typecheck:specs

      - name: Test with coverage
        run: npm run test:coverage

      - name: Type-check the packages
        run: |
          npm run build:schematics
          npm run typecheck:projects

      - name: Test the documentation site
        run: npm test --prefix src/docs

      # The builds the release runs, so that a package failing to bundle fails here and not halfway through a release
      - name: Build the packages
        run: npm run build:projects

      # Type-checks every template of the site, the ones no spec imports too: the tests compile only what they import
      - name: Build the documentation site
        run: npm run build --prefix src/docs
